<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page fill a notched screen edge to edge, and
         is what makes env(safe-area-inset-*) report real values instead of 0.
         Without it every safe-area rule in the app (chat composer, mobile nav
         drawer, cart, toasts) silently computed to its fallback. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RapiQR - Smart Safety QR Tags</title>
    <meta name="description" content="RapiQR smart QR tags for vehicles, luggage, and pets — scan to instantly contact the owner in an emergency, report a parking issue, or reunite lost items with their families." />
    <meta name="theme-color" content="#D9581F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/src/assets/REPIQR ICON .png" />
    <!-- Inter font for clean minimal typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Pinterest Sans font preloading for instant rendering -->
    <link rel="preload" href="/fonts/Pin-Sans-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Pin-Sans-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Pin-Sans-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Pin-Sans-Heavy.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Google Identity Services is loaded lazily, only when Google sign-in is
         actually attempted (see loadGoogleIdentityScript in AuthContext.tsx) —
         it was previously loaded eagerly here and shipped ~84% unused bytes to
         every visitor who never uses Google sign-in. -->
  </head>
  <body>
    <div id="root"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
